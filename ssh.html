<script type="text/javascript">
    RED.nodes.registerType('ssh-conf',{
        category: 'config',
        defaults: {
            ssh: { value: "" },
            name: { value: "" },
            userlabel: { value: "" }
        },
        credentials: {
            username: { type: "text" },
            password: { type: "password" },
            passphrase: { type: "password" },
            hostname: { value: "" },
            port: { value: "22" },
        },
        label: function () {
            return this.userlabel || this.name || "ssh-conf";
        },
        oneditsave: function() {
            this.userlabel = $("#node-config-input-name").val();
        }
    });
</script>

<script type="text/html" data-help-name="ssh-conf">
    <p>Static SSH server configuration.</p>
    <p>Every value here can be overridden per message through <code>msg.ssh</code>
    in the ssh-v3 node. Fields left empty can be provided entirely by the message.</p>
    <h3>Properties</h3>
    <dl class="message-properties">
        <dt>Hostname <span class="property-type">string</span></dt><dd>host name or IP address.</dd>
        <dt>Port <span class="property-type">number</span></dt><dd>defaults to 22.</dd>
        <dt>Username / Password</dt><dd>login credentials.</dd>
        <dt>Private key <span class="property-type">path</span></dt><dd>path, on the Node-RED host, to a private key file.</dd>
        <dt>Key passphrase</dt><dd>passphrase of an encrypted private key.</dd>
    </dl>
</script>


<script type="text/javascript">
    RED.nodes.registerType('ssh-v3', {
        category: 'server',
        color: '#7fff00',
        defaults: {
            name: { value: "" },
            conf: { value: "", type: "ssh-conf", required: false },
            keepOpen: { value: 60, validate: RED.validators.number(true) },
        },

        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-server",
        label: function () {
            return this.name || "ssh-v3";
        }
    });
</script>

<script type="text/html" data-template-name="ssh-v3">
    <div class="form-row">

<script type="text/html" data-help-name="ssh-v3">
    <p>Runs a command on a remote host over SSH.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">string</span></dt>
        <dd>command to run.</dd>
        <dt class="optional">ssh <span class="property-type">object</span></dt>
        <dd>dynamic connection settings. Any property set here overrides the selected
        server config; missing ones are taken from it. Supported properties:
        <ul>
            <li><code>host</code> (or <code>hostname</code>), <code>port</code></li>
            <li><code>username</code>, <code>password</code></li>
            <li><code>privateKey</code> &ndash; key content (string or Buffer)</li>
            <li><code>privateKeyPath</code> &ndash; path to a key file</li>
            <li><code>passphrase</code> &ndash; for encrypted keys</li>
            <li><code>readyTimeout</code>, <code>keepaliveInterval</code>, <code>keepaliveCountMax</code> (ms / count)</li>
        </ul>
        </dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>session <span class="property-type">object</span></dt>
        <dd><code>code</code> exit code, <code>signal</code>, <code>stdout</code> and
        <code>stderr</code> (arrays of chunks), and <code>host</code> (<code>user@host:port</code>).</dd>
    </dl>

    <h3>Details</h3>
    <p>Connections are reused per destination and credentials, and closed after being idle for
    <i>Keep open</i> seconds. A dropped connection is re-opened automatically on the next message.
    Commands sent to the same connection run one at a time.</p>
    <p><b>Note:</b> when <code>msg.ssh.host</code> is set and the node also has a server selected,
    that server's credentials are used for the new host unless <code>msg.ssh</code> provides its own.</p>

    <h3>Example</h3>
<pre>msg.payload = "uptime";
msg.ssh = {
    host: "10.0.0.5",
    username: "admin",
    password: "secret"
};
return msg;</pre>
</script>
